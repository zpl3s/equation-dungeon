<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Данжон уравнений</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#14101c;--panel:#221a30;--panel2:#2e2442;--line:#4a3a66;--text:#ece6f5;--muted:#9a8fb0;--hp:#d8413a;--xp:#4fb0d8;--gold:#f5d04a;--ok:#5bc04a;--bad:#ff6a5e;--acc:#9a4fd0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background-color:var(--bg);background-image:linear-gradient(#0d0a14 2px,transparent 2px),linear-gradient(90deg,#0d0a14 2px,transparent 2px);background-size:48px 24px;color:var(--text);font:16px/1.5 ui-monospace,Menlo,Consolas,monospace}
#app{max-width:900px;margin:0 auto;padding:16px}
.panel{background:var(--panel);border:4px solid var(--line);box-shadow:0 0 0 4px #0b0810;padding:16px;margin:0 0 20px}
h1,h2{font-family:'Press Start 2P',monospace;font-weight:400;margin:0 0 14px;line-height:1.5}
h1{font-size:22px;color:var(--gold);text-shadow:3px 3px 0 #000}
h2{font-size:14px;color:var(--gold)}
.px{font-family:'Press Start 2P',ui-monospace,monospace;line-height:1.7}
.c{text-align:center}.muted{color:var(--muted)}.small{font-size:11px}.gold{color:var(--gold)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.c{justify-content:center}
button{font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.4;color:var(--text);background:var(--panel2);border:3px solid var(--line);padding:10px 12px;cursor:pointer;box-shadow:inset -3px -3px 0 #0006}
button:hover:not(:disabled){border-color:var(--acc)}
button:active:not(:disabled){transform:translateY(2px)}
button.main{background:#5a2a8a;border-color:#b07ae0}
button:disabled{opacity:.4;cursor:default}
.bar{height:14px;background:#0b0810;border:2px solid #000;min-width:60px}
.bar>i{display:block;height:100%;width:0;background:var(--hp);transition:width .3s}
.bar.xp>i{background:var(--xp)}.bar.m>i{background:var(--ok)}
canvas{image-rendering:pixelated;display:block;margin:0 auto}
.sil{filter:brightness(0);opacity:.5}
.bob{animation:bob 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.arena{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;min-height:230px;background:linear-gradient(transparent 72%,#1a1326 72%),var(--panel);overflow:hidden}
.mons{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:flex-end}
.mon{position:relative;cursor:pointer;padding:8px;border:3px dashed transparent;text-align:center;min-width:110px}
.mon.sel{border-color:var(--gold)}
.mon.dead{opacity:.15;filter:grayscale(1);pointer-events:none;transition:opacity .6s}
.mon .bar{margin-top:6px}
.mname{font-size:9px;color:var(--muted);margin-bottom:6px}
.eq{font-size:30px;margin:12px 0;word-break:break-word}
.sys{display:inline-flex;align-items:center;gap:10px}.brace{font-size:70px;line-height:1;font-weight:200}
input{font:22px ui-monospace,Menlo,monospace;background:#0b0810;color:var(--text);border:3px solid var(--line);padding:10px;flex:1;min-width:0;outline:none}
input:focus{border-color:var(--gold)}
.hintbox{color:var(--xp)}
.msg{min-height:24px;margin-top:10px}
.dmg{position:absolute;left:50%;top:10px;font-family:'Press Start 2P',monospace;font-size:14px;color:#fff;text-shadow:2px 2px 0 #000;animation:fl 1s forwards;pointer-events:none;white-space:nowrap}
.dmg.crit{color:var(--gold);font-size:18px}
@keyframes fl{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-60px);opacity:0}}
.shake{animation:sh .12s 3}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.lunge{animation:lg .25s}
@keyframes lg{50%{transform:translateX(28px)}}
.lungel{animation:lgl .25s}
@keyframes lgl{50%{transform:translateX(-28px)}}
.flash{animation:fs .4s}
@keyframes fs{0%{background-color:#d8413a88}}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:9;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#000d;border:3px solid var(--gold);padding:10px 14px;font-family:'Press Start 2P',monospace;font-size:10px;line-height:1.7;max-width:90vw;animation:fl2 3.5s forwards}
@keyframes fl2{0%,85%{opacity:1}100%{opacity:0}}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:6px 8px;border-bottom:2px solid var(--line);text-align:left}
th{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--muted);font-weight:400}
.topic{display:flex;align-items:center;gap:12px;padding:6px 0;border-bottom:2px solid #0003}
.topic .bar{flex:1}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.item{background:var(--panel2);border:3px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.item button{margin-top:auto}
ul{padding-left:20px}li{margin-bottom:8px}
@media (max-width:600px){.eq{font-size:22px}.mon{min-width:88px}h1{font-size:16px}.arena{flex-direction:column;align-items:stretch}#hero{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
'use strict';
const KEY='eqdungeon.v1',$=s=>document.querySelector(s),app=$('#app');

// ---------- утилиты ----------
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const nz=(a,b)=>{let v;do v=R(a,b);while(!v);return v};
const co=m=>{let v;do v=R(-m,m);while(Math.abs(v)<2);return v};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const lcm=(a,b)=>a/gcd(a,b)*b;
const M=n=>n<0?'−'+(-n):''+n;
const term=(a,v)=>a===1?v:a===-1?'−'+v:M(a)+v;
function lx(ts){let s='';for(const[c,v]of ts){if(!c)continue;const a=Math.abs(c),t=v?(a===1?v:a+v):''+a;s+=s?(c<0?' − ':' + ')+t:(c<0?'−':'')+t}return s||'0'}
const xb=b=>lx([[1,'x'],[b,'']]);
const br=(a,inner)=>(a===-1?'−':M(a))+'('+inner+')';

// ---------- темы: каждая тема = свой монстр ----------
// d — сложность (множитель урона), par — норма времени в секундах (решение на бумаге)
const T=[
{id:'lin1',name:'Простые линейные',d:1,par:25,fmt:'num',mon:'slime',mn:'Слизень',gen(){
  const x=R(-9,15),k=R(0,3);
  if(k===0){const a=R(1,20);return{q:`x + ${a} = ${M(x+a)}`,a:x,h:`Вычти ${a} из обеих частей`}}
  if(k===1){const a=R(1,20);return{q:`x − ${a} = ${M(x-a)}`,a:x,h:`Прибавь ${a} к обеим частям`}}
  if(k===2){const a=co(9);return{q:`${term(a,'x')} = ${M(a*x)}`,a:x,h:`Раздели обе части на ${M(a)}`}}
  const a=R(2,9);return{q:`x/${a} = ${M(x)}`,a:x*a,h:`Умножь обе части на ${a}`}}},
{id:'lin2',name:'Линейные в два шага',d:2,par:40,fmt:'num',mon:'goblin',mn:'Гоблин',gen(){
  const x=R(-10,10),a=Math.random()<.7?R(2,9):co(9),b=nz(-20,20),c=a*x+b;
  const L=Math.random()<.7?lx([[a,'x'],[b,'']]):lx([[b,''],[a,'x']]);
  return{q:`${L} = ${M(c)}`,a:x,h:`Перенеси ${M(b)} вправо: ${term(a,'x')} = ${M(c-b)}`}}},
{id:'both',name:'Иксы с обеих сторон',d:3,par:55,fmt:'num',mon:'skeleton',mn:'Скелет',gen(){
  const x=R(-10,10);let a,c;do{a=nz(-9,9);c=nz(-9,9)}while(a===c);const b=nz(-20,20),d=a*x+b-c*x;
  return{q:`${lx([[a,'x'],[b,'']])} = ${lx([[c,'x'],[d,'']])}`,a:x,h:`Иксы влево, числа вправо: ${term(a-c,'x')} = ${M(d-b)}`}}},
{id:'brack',name:'Скобки',d:4,par:70,fmt:'num',mon:'golem',mn:'Голем',gen(){
  const k=R(0,2);
  if(k===0){const x=R(-9,9),a=co(7),b=nz(-9,9);return{q:`${br(a,xb(b))} = ${M(a*(x+b))}`,a:x,h:`Раздели обе части на ${M(a)}: ${xb(b)} = ${M(x+b)}`}}
  if(k===1){const x=R(-9,9),a=co(7),b=nz(-9,9);let c;do c=nz(-6,6);while(c===a);const d=a*(x+b)-c*x;
    return{q:`${br(a,xb(b))} = ${lx([[c,'x'],[d,'']])}`,a:x,h:`Раскрой скобки: ${lx([[a,'x'],[a*b,'']])} = ${lx([[c,'x'],[d,'']])}`}}
  for(;;){const x=R(-9,9),a=co(6),c=co(6),b=nz(-9,9);if(a===c)continue;const t=a*(x+b)-c*x;if(t%c)continue;const d=t/c;if(!d)continue;
    return{q:`${br(a,xb(b))} = ${br(c,xb(d))}`,a:x,h:`Раскрой обе скобки: ${lx([[a,'x'],[a*b,'']])} = ${lx([[c,'x'],[c*d,'']])}`}}}},
{id:'frac',name:'Дроби',d:4,par:70,fmt:'num',mon:'ghost',mn:'Призрак',gen(){
  const k=R(0,2);
  if(k===0){const b=R(2,9),c=nz(-9,9),a=nz(-9,9);return{q:`(${xb(a)})/${b} = ${M(c)}`,a:b*c-a,h:`Умножь обе части на ${b}: ${xb(a)} = ${M(b*c)}`}}
  if(k===1){let a,b;do{a=R(2,6);b=R(2,6)}while(a===b);const L=lcm(a,b),x=L*nz(-4,4),c=x/a+x/b;
    return{q:`x/${a} + x/${b} = ${M(c)}`,a:x,h:`Умножь всё на ${L}: ${term(L/a,'x')} + ${term(L/b,'x')} = ${M(c*L)}`}}
  for(;;){const b=R(2,6),d=R(2,6);if(b===d)continue;const x=R(-9,9),a=nz(-9,9),t=d*(x+a);if(t%b)continue;const c=t/b-x;if(!c)continue;
    return{q:`(${xb(a)})/${b} = (${xb(c)})/${d}`,a:x,h:`Крест-накрест: ${d}(${xb(a)}) = ${b}(${xb(c)})`}}}},
{id:'ineq',name:'Неравенства',d:4,par:60,fmt:'ineq',mon:'imp',mn:'Бес',gen(){
  const x0=R(-9,9),op=pick(['<','>','≤','≥']),F={'<':'>','>':'<','≤':'≥','≥':'≤'};
  if(Math.random()<.6){const a=Math.random()<.5?-R(1,6):R(2,6),b=nz(-15,15);
    return{q:`${lx([[a,'x'],[b,'']])} ${op} ${M(a*x0+b)}`,a:{op:a<0?F[op]:op,v:x0},h:a<0?`Перенеси ${M(b)} и раздели на ${M(a)} — знак перевернётся!`:`Перенеси ${M(b)} вправо и раздели на ${a}`}}
  let a,c;do{a=nz(-6,6);c=nz(-6,6)}while(a===c);const b=nz(-12,12),k=a-c,d=k*x0+b;
  return{q:`${lx([[a,'x'],[b,'']])} ${op} ${lx([[c,'x'],[d,'']])}`,a:{op:k<0?F[op]:op,v:x0},h:`Иксы влево, числа вправо: ${term(k,'x')} ${op} ${M(d-b)}`+(k<0?' — при делении на минус знак перевернётся!':'')}}},
{id:'quad',name:'Квадратные',d:5,par:90,fmt:'set',mon:'orc',mn:'Орк',gen(){
  let r,s;do{r=R(-9,9);s=R(-9,9)}while(r===s||Math.abs(r*s)>60);const b=-(r+s),c=r*s;
  return{q:`${lx([[1,'x²'],[b,'x'],[c,'']])} = 0`,a:[r,s],h:c===0?'Вынеси x за скобку':`Подбери два числа: произведение ${M(c)}, сумма ${M(-b)}. Или через D = b² − 4ac`}}},
{id:'abs',name:'Модули',d:5,par:75,fmt:'set',mon:'mimic',mn:'Мимик',gen(){
  if(Math.random()<.6){const p=nz(-9,9),c=R(1,9),k=Math.random()<.3?R(1,9):0,E=xb(-p);
    return{q:`|${E}|${k?' + '+k:''} = ${c+k}`,a:[p-c,p+c],h:(k?`Перенеси ${k}: |${E}| = ${c}. `:'')+`Два случая: ${E} = ${c} или ${E} = −${c}`}}
  const a=R(2,3);let x1,dd;do{x1=R(-6,8);dd=R(1,6)}while(a*dd%2);const c=a*dd/2,E=lx([[a,'x'],[c-a*x1,'']]);
  return{q:`|${E}| = ${c}`,a:[x1,x1-dd],h:`Два случая: ${E} = ${c} или ${E} = −${c}`}}},
{id:'sys',name:'Системы',d:6,par:120,fmt:'pair',mon:'twins',mn:'Близнецы',gen(){
  const x=R(-8,8),y=R(-8,8);
  if(Math.random()<.35){const a=co(5),b=nz(-5,5);return{q:[`y = ${xb(y-x)}`,`${lx([[a,'x'],[b,'y']])} = ${M(a*x+b*y)}`],a:[x,y],h:'Подставь y из первого уравнения во второе'}}
  let a,b,c,d;do{a=nz(-5,5);b=nz(-5,5);c=nz(-5,5);d=nz(-5,5)}while(a*d-b*c===0);
  return{q:[`${lx([[a,'x'],[b,'y']])} = ${M(a*x+b*y)}`,`${lx([[c,'x'],[d,'y']])} = ${M(c*x+d*y)}`],a:[x,y],h:'Домножь уравнения так, чтобы коэффициенты при y стали противоположными, и сложи их'}}},
{id:'quad2',name:'Квадратные+',d:6,par:120,fmt:'set',mon:'serpent',mn:'Змей',gen(){
  let r,s;do{r=R(-7,7);s=R(-7,7)}while(r===s);const k=R(0,2);
  if(k===0){const a=pick([2,3,-1,-2]);return{q:`${lx([[a,'x²'],[-a*(r+s),'x'],[a*r*s,'']])} = 0`,a:[r,s],h:`Раздели обе части на ${M(a)}`}}
  if(k===1){const p=-(r+s),q=-r*s;return{q:p?`x(${xb(p)}) = ${M(q)}`:`x² = ${M(q)}`,a:[r,s],h:p?`Раскрой скобку и перенеси всё влево: ${lx([[1,'x²'],[p,'x'],[-q,'']])} = 0`:'Извлеки корень из обеих частей'}}
  const p=nz(-7,7),q=R(1,8);return{q:`(${xb(p)})² = ${q*q}`,a:[-p-q,-p+q],h:`Извлеки корень: ${xb(p)} = ±${q}`}}},
];
const FH={num:'Ответ — число: 7, -3 или 3/4',set:'Два корня через запятую: 2, -5',pair:'x и y через запятую: 3, -1',ineq:'Например: x > 3 или x <= -2'};

// ---------- проверка ответа ----------
const same=(p,q)=>Math.abs(p-q)<1e-9;
function num(t){const m=t.match(/^(-?\d+(?:\.\d+)?)(?:\/(-?\d+(?:\.\d+)?))?$/);if(!m)return NaN;return m[2]!==undefined?+m[1]/+m[2]:+m[1]}
function check(e,inp){
  let s=inp.toLowerCase().replace(/[−–—]/g,'-').replace(/≤/g,'<=').replace(/≥/g,'>=');
  if(e.fmt==='ineq'){
    s=s.replace(/\s+/g,'').replace(/^x/,'').replace('=>','>=').replace('=<','<=');
    const m=s.match(/^(<=|>=|<|>)(.+)$/);if(!m)return{err:'Формат: x > 3 или x <= -2'};
    const v=num(m[2]);if(isNaN(v))return{err:'Не понял число после знака'};
    const op={'<=':'≤','>=':'≥'}[m[1]]||m[1];return{ok:op===e.a.op&&same(v,e.a.v)}}
  s=s.replace(/[a-zа-я]\s*[₁₂12]?\s*=/g,' ').replace(/-\s+/g,'-');
  const p=s.split(/[,;\s]+/).filter(Boolean).map(num),n=e.fmt==='num'?1:2;
  if(p.some(isNaN))return{err:'Не понял ответ. Пример: '+(n===1?'-3 или 3/4':'2, -5')};
  if(p.length!==n)return{err:n===1?'Нужно одно число':e.fmt==='pair'?'Нужно два числа: x, y':'Нужно два корня через запятую'};
  if(n===1)return{ok:same(p[0],e.a)};
  if(e.fmt==='pair')return{ok:same(p[0],e.a[0])&&same(p[1],e.a[1])};
  const A=[...e.a].sort((a,b)=>a-b),B=p.sort((a,b)=>a-b);return{ok:same(A[0],B[0])&&same(A[1],B[1])}}
function fa(e){const a=e.a;if(e.fmt==='num')return'x = '+M(a);if(e.fmt==='pair')return`x = ${M(a[0])}, y = ${M(a[1])}`;if(e.fmt==='ineq')return`x ${a.op} ${M(a.v)}`;return`x = ${M(a[0])} или x = ${M(a[1])}`}

// ---------- пиксель-арт: 16 строк по 8 символов, правая половина зеркалится ----------
const PAL={k:'#1b1325',w:'#f2f0e6',l:'#b8b8c8',e:'#6e6e80',E:'#3d3d4d',r:'#d8413a',R:'#8a1f2a',y:'#f5d04a',g:'#5bc04a',G:'#2f7a32',c:'#6fd3e8',b:'#3f6fd8',B:'#23367a',p:'#9a4fd0',P:'#552a80',s:'#f0b88a',n:'#9a6232',N:'#5a3418'};
const SPR={
hero:'.......r|.....kkr|....klll|...kllll|...kkkkk|...klcll|...kllll|....kkkk|..kbbbbb|.kbbbbby|.klkbbby|.kskbbbb|..kknnnn|....kbbb|....kbk.|....kkk.',
slime:'........|........|........|........|......kk|....kkgg|...kgggg|..kglggg|..kggggg|.kggwkgg|.kggkkgg|.kgggggg|.kGggggg|..kGGGGG|...kkkkk|........',
goblin:'........|........|.....kkk|....kggg|k..kgggg|kgkggggg|.kkgykgg|...kgggg|...kgkwk|....kggg|...knnnn|..kgnnNn|..kgnnnn|...knnnn|....kgk.|....kkk.',
skeleton:'........|.....kkk|....kwww|...kwwww|...kwkkw|...kwkkw|...kwwwk|....kwkw|.....kkk|..kkkkkw|.kw.kwww|.kw..kkw|.kw.kwww|..w..kkw|....kw..|...kkw..',
golem:'........|....kkkk|...keeee|...keEee|...kecee|...keeee|.kkkeeee|keeeEeee|keEeeeee|keekeeee|keekeEee|kEEkeeee|.kk.keee|....keek|...keek.|...kkkk.',
ghost:'........|........|.....kkk|....kwww|...kwwww|...kwkkw|..kwwkkw|..kwwwww|..kwwwkk|.kcwwwww|.kcwwwww|.kccwwww|..kccwww|..kcckcc|...k.kk.|........',
imp:'........|..k.....|..ky....|...ky.kk|...kykrr|....krrr|...krykr|...krrrr|....krkw|.k..kkrr|krk.krrr|.kkkrRrr|...krrrr|....krkk|....kr..|....kk..',
mimic:'........|........|........|..kkkkkk|.knnynnn|.knNnnnn|.kkkkkkk|.kwkwkwk|.kRRRRRR|.kRRrRRR|.kwkwkwk|.kkkkkky|.knnnnny|.knNnnnn|.kkkkkkk|........',
twins:'........|........|........|..kkk...|.kbbbk..|kbwkbbk.|kbbbbbk.|kbkkkbk.|.kbbbk..|..kbk...|.kbbbk..|kbbbbbk.|kbkbkbk.|.kb.bk..|.k...k..|........',
serpent:'........|.....kkk|...kkppp|..kppppp|.kppykpp|.kpppppp|.kPpppkr|..kPpppr|...kkkpp|......kp|...kkkpp|..kpppPp|.kpPPppp|.kppppPP|..kkkkkk|........',
boss:'..y..y.y|..yyyyyy|..kyryyy|..kkkkkk|..kPPPPP|..kPrkPP|..kPPPPP|...kPkwk|.kkkPPPP|kpppppyp|kpkppppy|kpkppppy|kpkpppyp|kk.kpppp|...kPPk.|...kkkk.'};
const SWAP={orc:{base:'goblin',g:'#4f8f3c',G:'#2a5a26',y:'#d8413a',n:'#6e6e80',N:'#3d3d4d'}};
function paint(cv){const sw=SWAP[cv.dataset.spr]||{},rows=SPR[sw.base||cv.dataset.spr].split('|'),sc=+cv.dataset.sc,g=cv.getContext('2d');
  cv.width=16*sc;cv.height=rows.length*sc;
  rows.forEach((h,y)=>[...h+[...h].reverse().join('')].forEach((ch,x)=>{if(ch==='.')return;g.fillStyle=sw[ch]||PAL[ch];g.fillRect(x*sc,y*sc,sc,sc)}))}
const paintAll=()=>document.querySelectorAll('canvas[data-spr]').forEach(paint);
const spr=(n,sc=5,cls='bob')=>`<canvas data-spr="${n}" data-sc="${sc}" class="${cls}"></canvas>`;

// ---------- сохранение и прогресс ----------
const DEF={xp:0,lvl:1,gold:0,sword:0,armor:0,potions:2,scrolls:3,unlocked:2,stats:{},days:{},streak:0,lastDay:'',runs:0,wins:0,bestCombo:0};
const fresh=()=>JSON.parse(JSON.stringify(DEF));
function load(){let o={};try{o=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}return Object.assign(fresh(),o)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(),run=null,tick=null,busy=0,view=null;
const need=l=>30+20*l;
const maxHP=()=>100+(S.lvl-1)*5+S.armor*10;
const atk=()=>1+(S.lvl-1)*.05+S.sword*.1;
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const today=()=>dk(Date.now()),yday=()=>dk(Date.now()-864e5);
const st=id=>S.stats[id]||(S.stats[id]={n:0,ok:0,t:0,best:0,r:[]});
const acc=q=>q.r.length?q.r.reduce((a,b)=>a+b,0)/q.r.length:.7;
const streak=()=>S.lastDay===today()||S.lastDay===yday()?S.streak:0;
function record(t,ok,s){const q=st(t.id);q.n++;q.r.push(ok?1:0);if(q.r.length>10)q.r.shift();if(ok){q.ok++;q.t+=s;if(!q.best||s<q.best)q.best=s}
  const d=S.days[today()]||(S.days[today()]={n:0,ok:0,t:0});d.n++;if(ok)d.ok++;d.t+=s}
function gainXP(x){S.xp+=x;run.xp+=x;while(S.xp>=need(S.lvl)){S.xp-=need(S.lvl);S.lvl++;run.hp+=5;toast(`Новый уровень ${S.lvl}! +5 HP, +5% урона`)}}
// новая тема открывается, когда по самой свежей: 8+ верных и 70%+ точности в последних 10
function checkUnlock(){if(S.unlocked>=T.length)return;const q=S.stats[T[S.unlocked-1].id];if(q&&q.ok>=8&&acc(q)>=.7)unlockNext()}
function unlockNext(){if(S.unlocked>=T.length)return;const t=T[S.unlocked];S.unlocked++;if(run)run.unl.push(t.name);toast(`Новая тема: ${t.name}! Новый монстр: ${t.mn}`)}

// адаптив: слабые темы чаще, свежая тема — глубже по этажам, старые лёгкие — реже
function chooseTopic(floor){const f=S.unlocked-1,w=[];
  for(let i=0;i<=f;i++){const q=S.stats[T[i].id];let v=1+(1-(q?acc(q):.7))*4;if(i===f)v+=[.5,2,3][floor];if(i===f-1)v+=1;if(i<f-3)v*=.4;w.push(v)}
  let x=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<w.length;i++){x-=w[i];if(x<=0)return i}return f}
const bossTopic=()=>pick([0,0,0,1,1,2].map(k=>S.unlocked-1-k).filter(i=>i>=0));
const newEq=i=>({...T[i].gen(),ti:i,fmt:T[i].fmt,el:0,at:0,hinted:false});
const el=e=>(e.el+(e.at?Date.now()-e.at:0))/1000;
const spd=(s,p)=>{const r=s/p;return r<=.5?2:r<=1?1+(1-r)*.5:Math.max(.4,1/r)};
const cm=()=>1+.1*Math.min(run.combo,10);

// ---------- забег: 3 этажа, число = монстров в комнате, 0 = босс ----------
const PLAN=[[1,1,2],[1,2,2],[2,2,0]];
function startRun(){run={floor:0,room:0,hp:maxHP(),combo:0,maxc:0,n:0,ok:0,time:0,crits:0,gold:0,xp:0,unl:[],mons:[],tg:0,healed:0};enterRoom()}
function spawn(i){const t=T[i],f=run.floor,hp=Math.round(16*t.d*(1+.15*f));return{ti:i,name:t.mn,spr:t.mon,hp,max:hp,atk:6+3*t.d+2*f,eq:newEq(i)}}
function enterRoom(){view=null;const n=PLAN[run.floor][run.room];
  if(n===0){const d=T[S.unlocked-1].d,hp=55*d;run.mons=[{boss:1,name:'Лорд Икс',spr:'boss',hp,max:hp,atk:14+4*d,eq:newEq(bossTopic())}]}
  else run.mons=Array.from({length:n},()=>spawn(chooseTopic(run.floor)));
  run.tg=0;battle();sel(0)}

function battle(){
  app.innerHTML=`<div class="panel row" id="hud"></div>
  <div class="panel arena" id="arena"><div id="hero">${spr('hero',6)}</div><div class="mons">${run.mons.map((m,k)=>`<div class="mon" id="m${k}" data-act="sel" data-i="${k}"><div class="mname px">${m.name}</div>${spr(m.spr,m.boss?8:5)}<div class="bar m"><i></i></div></div>`).join('')}</div></div>
  <div class="panel">
    <div class="px small muted" id="tinfo"></div>
    <div class="eq" id="eq"></div>
    <div class="hintbox" id="hint"></div>
    <div class="row" style="flex-wrap:nowrap;margin-top:8px"><input id="ans" autocomplete="off" spellcheck="false"><button class="main" data-act="hit">Удар</button></div>
    <div class="small muted" id="fh" style="margin-top:6px"></div>
    <div class="row" style="margin-top:12px"><span id="timer" class="px small"></span><span style="flex:1"></span><button data-act="scroll" id="bs"></button><button data-act="potion" id="bp"></button></div>
    <div class="msg" id="msg"></div>
  </div>`;
  paintAll();updHUD();run.mons.forEach((_,k)=>updMon(k));
  $('#ans').addEventListener('keydown',e=>{if(e.key==='Enter')hit()});
  clearInterval(tick);tick=setInterval(updTimer,250)}
function updHUD(){const mx=maxHP(),hp=Math.max(0,run.hp),rm=PLAN[run.floor][run.room];
  $('#hud').innerHTML=`<span class="px small">Этаж ${run.floor+1} · ${rm===0?'<span class="bad">БОСС</span>':'комната '+(run.room+1)+'/'+PLAN[run.floor].length}</span>
  <span class="px small bad">HP ${hp}/${mx}</span><div class="bar" style="flex:1"><i style="width:${hp/mx*100}%"></i></div>
  <span class="px small">${run.combo>1?'Комбо ×'+cm().toFixed(1):''}</span><span class="px small gold">${S.gold} з.</span><button data-act="flee">Выйти</button>`;
  $('#bs').textContent=`Подсказка (${S.scrolls})`;$('#bp').textContent=`Зелье (${S.potions})`;$('#bs').disabled=!S.scrolls;$('#bp').disabled=!S.potions||run.hp>=mx}
function updMon(k){const m=run.mons[k],e=$('#m'+k);e.classList.toggle('sel',k===run.tg&&m.hp>0);e.classList.toggle('dead',m.hp<=0);e.querySelector('.bar i').style.width=Math.max(0,m.hp)/m.max*100+'%'}
function sel(k){const m=run.mons[k];if(!m||m.hp<=0)return;const cur=run.mons[run.tg];if(cur&&cur.eq.at){cur.eq.el+=Date.now()-cur.eq.at;cur.eq.at=0}
  run.tg=k;m.eq.at=Date.now();run.mons.forEach((_,j)=>updMon(j));showEq();$('#ans').focus()}
function showEq(){const e=run.mons[run.tg].eq,t=T[e.ti];
  $('#tinfo').textContent=`${t.name} · норма ${t.par} с`;
  $('#eq').innerHTML=Array.isArray(e.q)?`<span class="sys"><span class="brace">{</span><span>${e.q.join('<br>')}</span></span>`:e.q;
  $('#hint').textContent=e.hinted?'Подсказка: '+e.h:'';$('#fh').textContent=FH[e.fmt];
  $('#ans').value='';$('#ans').placeholder={num:'x = ?',set:'x₁, x₂',pair:'x, y',ineq:'x > ?'}[e.fmt]}
function updTimer(){const tm=$('#timer');if(!tm||!run)return;const m=run.mons[run.tg];if(!m||m.hp<=0)return;const s=el(m.eq),p=T[m.eq.ti].par;
  tm.textContent=`Время: ${Math.floor(s)} с`;tm.style.color=s<=p/2?'var(--gold)':s<=p?'var(--ok)':'var(--muted)'}

function hit(){if(!run||busy)return;const k=run.tg,m=run.mons[k];if(!m||m.hp<=0)return;const e=m.eq,inp=$('#ans').value;
  if(!inp.trim())return msg('Сначала впиши ответ','muted');
  const res=check(e,inp);if(res.err)return msg(res.err,'muted');
  const s=el(e),t=T[e.ti];e.at=0;record(t,res.ok,s);run.n++;
  if(res.ok){
    const sp=spd(s,t.par),crit=sp>=2,dmg=Math.max(1,Math.round(10*t.d*sp*cm()*atk()*(e.hinted?.5:1)));
    run.ok++;run.time+=s;run.combo++;run.maxc=Math.max(run.maxc,run.combo);if(crit)run.crits++;
    gainXP(5*t.d+(crit?5:0));m.hp-=dmg;
    anim($('#hero canvas'),'lunge');anim($('#m'+k+' canvas'),'shake');pop(k,(crit?'КРИТ! ':'')+'−'+dmg,crit);
    let txt=`${crit?'Критический удар!':'Верно!'} ${Math.round(s)} с · урон ${dmg}`;
    if(m.hp<=0){const g=m.boss?40:3+2*t.d;S.gold+=g;run.gold+=g;txt+=` · ${m.name} повержен! +${g} з.`}
    else m.eq=newEq(m.boss?bossTopic():m.ti);
    msg(txt,crit?'gold':'ok');
  }else{
    run.combo=0;run.hp-=m.atk;anim($('#m'+k+' canvas'),'lungel');anim($('#arena'),'flash');
    msg(`Неверно. Правильно: ${fa(e)}. ${m.name} бьёт на ${m.atk}`,'bad');m.eq=newEq(m.boss?bossTopic():m.ti);
  }
  checkUnlock();save();updHUD();updMon(k);
  if(run.hp<=0){busy=1;setTimeout(()=>endRun(false),1200);return}
  if(m.hp<=0){const nx=run.mons.findIndex(q=>q.hp>0);if(nx<0){busy=1;setTimeout(roomClear,900);return}sel(nx)}
  else{m.eq.at=Date.now();showEq()}}
function useScroll(){const e=run.mons[run.tg].eq;if(!S.scrolls||e.hinted)return;S.scrolls--;e.hinted=true;save();$('#hint').textContent='Подсказка: '+e.h;updHUD();$('#ans').focus()}
function usePotion(){const mx=maxHP();if(!S.potions||run.hp>=mx)return;S.potions--;run.hp=Math.min(mx,run.hp+Math.round(mx*.5));save();updHUD();msg('Выпито зелье: +50% HP','ok');$('#ans').focus()}
function roomClear(){busy=0;clearInterval(tick);
  if(PLAN[run.floor][run.room]===0)return endRun(true);
  toast('Комната зачищена!');run.room++;
  if(run.room>=PLAN[run.floor].length){run.floor++;run.room=0;const mx=maxHP();run.healed=Math.min(mx-run.hp,Math.round(mx*.25));run.hp+=run.healed;save();return show(campView)}
  enterRoom()}
function endRun(win){busy=0;clearInterval(tick);const r=run;run=null;S.runs++;if(win){S.wins++;S.gold+=25;r.gold+=25}
  S.bestCombo=Math.max(S.bestCombo,r.maxc);
  if(S.lastDay!==today()){S.streak=S.lastDay===yday()?S.streak+1:1;S.lastDay=today()}save();
  const row=(a,b)=>`<tr><td>${a}</td><td>${b}</td></tr>`;
  show(()=>{app.innerHTML=`<div class="panel c"><h1>${win?'Победа!':'Забег окончен'}</h1>${spr(win?'hero':'boss',6)}
  <p>${win?'Лорд Икс повержен. Данжон зачищен!':'Опыт и золото остаются с тобой. Завтра — снова вниз.'}</p>
  <table>${row('Решено верно',`${r.ok} из ${r.n}`)}${row('Точность',r.n?Math.round(r.ok/r.n*100)+'%':'—')}${row('Среднее время',r.ok?Math.round(r.time/r.ok)+' с':'—')}
  ${row('Критов',r.crits)}${row('Лучшее комбо',r.maxc)}${row('Золото',`+${r.gold}`)}${row('Опыт',`+${r.xp}`)}${r.unl.length?row('Новые темы',r.unl.join(', ')):''}</table>
  <p class="px small gold" style="margin-top:16px">Серия: ${S.streak} дн.</p><div class="row c"><button class="main" data-act="hub">В лагерь</button></div></div>`;paintAll()})}

// ---------- экраны ----------
function show(fn){view=fn;fn();window.scrollTo(0,0)}
function hub(){const dd=S.days[today()]||{n:0,ok:0,t:0};
  app.innerHTML=`<div class="panel c"><h1>Данжон уравнений</h1>${spr('hero',7)}
  <p class="px small" style="margin-top:12px">Уровень ${S.lvl}</p><div class="bar xp" style="max-width:300px;margin:0 auto"><i style="width:${S.xp/need(S.lvl)*100}%"></i></div>
  <p class="small muted">${S.xp}/${need(S.lvl)} опыта</p>
  <div class="row c"><span class="bad">HP ${maxHP()}</span><span>Урон ×${atk().toFixed(2)}</span><span class="gold">${S.gold} золота</span><span>Зелья: ${S.potions}</span><span>Свитки: ${S.scrolls}</span></div>
  <p class="px small" style="margin-top:16px">Серия: <span class="gold">${streak()} дн.</span> · Сегодня: ${dd.ok} верно, ${Math.round(dd.t/60)} мин</p>
  <div class="row c" style="margin-top:16px"><button class="main" data-act="start">В данжон</button><button data-act="shop">Лавка</button><button data-act="stats">Статистика</button><button data-act="help">Как играть</button></div></div>
  <div class="panel"><h2>Бестиарий тем</h2>${T.map((t,i)=>{if(i>=S.unlocked)return`<div class="topic muted">${spr(t.mon,3,'sil')}<span class="px small">??? — откроется позже</span></div>`;
    const q=S.stats[t.id],a=q?acc(q):0;return`<div class="topic">${spr(t.mon,3,'')}<div style="flex:1"><div class="px small">${t.mn} · ${t.name}</div><div class="bar m" style="margin-top:6px"><i style="width:${q?Math.min(1,q.ok/8)*a*100:0}%"></i></div></div><span class="small muted">${q?q.ok+' верно · '+Math.round(a*100)+'%':'нет попыток'}</span></div>`}).join('')}</div>`;paintAll()}
const SHOP=[
  {id:'potions',name:'Зелье лечения',d:'Восстанавливает 50% HP в бою',c:()=>15},
  {id:'scrolls',name:'Свиток подсказки',d:'Показывает первый шаг. Урон этого удара ×0.5',c:()=>10},
  {id:'sword',name:'Заточка меча',d:'+10% урона навсегда',c:()=>40+30*S.sword},
  {id:'armor',name:'Укрепление брони',d:'+10 к макс. HP навсегда',c:()=>40+30*S.armor}];
const shopHTML=()=>`<div class="panel"><h2>Лавка</h2><p class="px small gold">${S.gold} золота</p><div class="shop">${SHOP.map(it=>`<div class="item"><span class="px small">${it.name}</span><span class="small muted">${it.d}</span><span class="small">${it.id==='potions'||it.id==='scrolls'?'Есть: ':'Уровень: '}${S[it.id]}</span><button data-act="buy" data-id="${it.id}" ${S.gold<it.c()?'disabled':''}>Купить · ${it.c()}</button></div>`).join('')}</div></div>`;
function buy(id){const it=SHOP.find(x=>x.id===id),c=it.c();if(S.gold<c)return;S.gold-=c;S[id]++;if(id==='armor'&&run)run.hp+=10;save();toast('Куплено: '+it.name);view&&view()}
function shopScreen(){app.innerHTML=shopHTML()+'<div class="row"><button data-act="hub">Назад</button></div>'}
function campView(){app.innerHTML=`<div class="panel c"><h1>Привал</h1>${spr('hero',6)}<p>Этаж ${run.floor} пройден. Отдых у костра: +${run.healed} HP (сейчас ${run.hp}/${maxHP()}).</p>
  <p class="muted">Дальше — этаж ${run.floor+1}${run.floor===PLAN.length-1?' и Лорд Икс':''}.</p><div class="row c"><button class="main" data-act="next">Спуститься глубже</button></div></div>${shopHTML()}`;paintAll()}
function stats(){const days=[...Array(7)].map((_,i)=>dk(Date.now()-(6-i)*864e5));
  app.innerHTML=`<div class="panel"><h2>Статистика</h2><table><tr><th>Тема</th><th>Верно</th><th>Точность*</th><th>Ср. время</th><th>Рекорд</th><th>Норма</th></tr>${T.slice(0,S.unlocked).map(t=>{const q=S.stats[t.id];
    return`<tr><td>${t.name}</td><td>${q?q.ok+'/'+q.n:'—'}</td><td>${q&&q.r.length?Math.round(acc(q)*100)+'%':'—'}</td><td>${q&&q.ok?Math.round(q.t/q.ok)+' с':'—'}</td><td>${q&&q.best?Math.round(q.best)+' с':'—'}</td><td>${t.par} с</td></tr>`}).join('')}</table>
  <p class="small muted">* по последним 10 попыткам. Слабые темы попадаются чаще.</p></div>
  <div class="panel"><h2>Последние 7 дней</h2>${days.map(d=>{const x=S.days[d];return`<div class="topic"><span class="small" style="width:60px">${d.slice(5)}</span><div class="bar xp"><i style="width:${x?Math.min(100,x.ok*3):0}%"></i></div><span class="small muted" style="width:140px">${x?x.ok+' верно · '+Math.round(x.t/60)+' мин':'—'}</span></div>`}).join('')}
  <p class="small muted">Забегов: ${S.runs} · побед: ${S.wins} · лучшее комбо: ${S.bestCombo}</p></div>
  <div class="row"><button data-act="hub">Назад</button>${S.unlocked<T.length?'<button data-act="skip">Открыть следующую тему досрочно</button>':''}<button data-act="reset">Сбросить прогресс</button></div>`}
function help(){app.innerHTML=`<div class="panel"><h2>Как играть</h2><ul>
  <li>В комнате 1–2 монстра. Кликни монстра — увидишь его уравнение. Реши на бумаге, впиши ответ, нажми Enter.</li>
  <li>Урон = сложность темы × скорость × комбо. Уложился в половину нормы — крит ×2. Медленнее нормы — урон падает (но не ниже 40%).</li>
  <li>Ошибся — монстр бьёт тебя, комбо сгорает, показывается правильный ответ.</li>
  <li>Забег: 3 этажа, между ними привал с лавкой, в конце босс Лорд Икс. Примерно 15–20 минут.</li>
  <li>Новая тема (и новый монстр) открывается сама: 8 верных и 70% точности по последней теме. Слабые темы попадаются чаще.</li>
  <li>Форматы ответа: число (-3, 3/4); два корня через запятую (2, -5); система — x, y (3, -1); неравенство — x > 3 или x <= -2.</li>
  <li>Опыт → уровни (+HP, +урон). Золото → лавка. Серия дней растёт, если завершаешь хотя бы один забег в день.</li></ul></div>
  <div class="row"><button data-act="hub">Назад</button></div>`}

// ---------- эффекты ----------
function anim(e,c){if(!e)return;e.classList.remove(c);void e.offsetWidth;e.classList.add(c);setTimeout(()=>e.classList.remove(c),500)}
function pop(k,text,crit){const d=document.createElement('div');d.className='dmg'+(crit?' crit':'');d.textContent=text;$('#m'+k).appendChild(d);setTimeout(()=>d.remove(),1000)}
function msg(t,c){$('#msg').innerHTML=`<span class="${c}">${t}</span>`}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;$('#toast').appendChild(d);setTimeout(()=>d.remove(),3500)}

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const A={start:startRun,hub:()=>show(hub),shop:()=>show(shopScreen),stats:()=>show(stats),help:()=>show(help),hit,
    sel:()=>sel(+b.dataset.i),scroll:useScroll,potion:usePotion,buy:()=>buy(b.dataset.id),next:enterRoom,
    flee:()=>{if(confirm('Выйти из забега? Опыт и золото сохранятся.'))endRun(false)},
    skip:()=>{unlockNext();save();show(stats)},
    reset:()=>{if(confirm('Стереть весь прогресс?')){S=fresh();save();show(hub)}}};
  A[b.dataset.act]&&A[b.dataset.act]()});
show(hub);
</script>
</body>
</html>
