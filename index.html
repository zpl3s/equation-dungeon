<!-- GitHub Pages разрешает кэшировать файлы на 10 минут, а обычная перезагрузка в Chrome не перекачивает скрипты.

<script>const EQ_V='?v='+Date.now();document.write('<link rel="stylesheet" href="css/style.css'+EQ_V+'">')</script>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>['assets/env/atlas.js','js/math.js','js/world.js','js/sprites.js','js/biomes.js','js/map.js','js/faces.js','js/prikazy.js','js/onboarding.js','js/bestiary.js','js/game.js'].forEach(f=>document.write('<script src="'+f+EQ_V+'"><\/script>'))</script>
